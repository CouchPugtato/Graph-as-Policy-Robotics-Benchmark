[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-as-policy-isaac-reproduction"
version = "0.1.0"
description = "Windows-native reproduction tooling for Graph-as-Policy in NVIDIA Isaac Sim"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
harness-tools = [
  "uv>=0.8,<1",
]
libero-adapter = [
  "numpy>=1.23,<2",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]

[project.scripts]
gap-isaac = "gap_isaac.cli:app"
gap-libero = "gap_libero.cli:main"
gap-harness = "gap_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
